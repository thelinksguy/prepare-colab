<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prepare Google Colab Notebook</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    a.bookmarklet {
      display: inline-block;
      padding: 0.5em 1em;
      background: #4CAF50;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Prepare Google Colab Notebook</h1>
  <p>
    Drag the link below to your bookmarks bar:
  </p>
  <p>
    <a class="bookmarklet" href="javascript:(function(){var style=document.createElement('style');style.textContent='md-text-button.show-code-button { display: none !important; }';document.head.appendChild(style);console.log('Injected CSS to hide the Show Code button.');})();">Prepare Colab</a>
  </p>
  <p>
    <strong>Instructions:</strong>
    <br>1. Drag the above link to your bookmarks bar.
    <br>2. While in Google Colab, click the bookmark "Prepare Colab" button.
  </p>
</body>
</html>
